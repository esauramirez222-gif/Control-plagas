<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B2440">
  <title>HK Control de Plagas</title>
  <link rel="icon" href="img/logo-hk.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=20261123a">
</head>
<body>
  <div class="app">
    <!-- Menú principal: barra lateral en computadora, barra inferior en celular -->
    <nav class="nav" aria-label="Menú principal">
      <a class="nav__brand" href="#/inicio">
        <img class="nav__logo" src="img/logo-hk.svg" alt="" width="40" height="40">
        <span>
          <strong id="brand-name">HK Control de Plagas</strong>
          <small>Clientes y servicios</small>
        </span>
      </a>
      <ul class="nav__list" id="nav-list"></ul>
      <a class="nav__settings" href="#/ajustes" data-route="ajustes"></a>
    </nav>

    <div class="content">
      <header class="topbar">
        <div class="topbar__text">
          <a class="topbar__back" id="page-back" href="#/clientes" hidden></a>
          <h1 class="topbar__title" id="page-title">Inicio</h1>
          <p class="topbar__subtitle" id="page-subtitle"></p>
        </div>
        <div class="topbar__actions">
          <span class="save-state" id="save-state" role="status" aria-live="polite" hidden></span>
          <div class="page-actions" id="page-actions"></div>
          <a class="icon-btn topbar__settings" href="#/ajustes" aria-label="Ajustes" title="Ajustes"><span data-icon="settings"></span></a>
          <button class="icon-btn topbar__salir" id="btn-salir" data-action="cerrar-sesion" aria-label="Cerrar sesión" title="Cerrar sesión" hidden><span data-icon="logout"></span></button>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- Orden importa: utilidades → datos → interfaz → pantallas → arranque -->
  <script src="js/icons.js?v=20261123a"></script>
  <script src="js/utils.js?v=20261123a"></script>
  <script src="js/store.js?v=20261123a"></script>
  <script src="js/demo-data.js?v=20261123a"></script>
  <script src="js/ui.js?v=20261123a"></script>
  <script src="js/charts.js?v=20261123a"></script>
  <script src="js/components.js?v=20261123a"></script>
  <script src="js/forms.js?v=20261123a"></script>
  <script src="js/views.js?v=20261123a"></script>
  <script src="js/app.js?v=20261123a"></script>
</body>
</html>
